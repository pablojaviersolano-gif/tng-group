<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="45%" stop-color="#e7ebf1"/>
      <stop offset="100%" stop-color="#d3dae4"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7cfda"/>
      <stop offset="100%" stop-color="#aab4c2"/>
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a94a3"/>
      <stop offset="100%" stop-color="#5f6a7a"/>
    </linearGradient>
    <linearGradient id="boxGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3e7ee"/>
    </linearGradient>
    <linearGradient id="boxGradKraft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9c3a0"/>
      <stop offset="100%" stop-color="#c1a67e"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="motionBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7 1.5"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a2233" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- Ceiling light glow -->
  <rect x="0" y="0" width="800" height="320" fill="url(#lightGlow)"/>

  <!-- Perspective floor -->
  <polygon points="0,900 800,900 800,660 0,660" fill="url(#floorGrad)"/>
  <g stroke="#8f99a8" stroke-width="1.5" opacity="0.4">
    <line x1="400" y1="660" x2="40" y2="900"/>
    <line x1="400" y1="660" x2="220" y2="900"/>
    <line x1="400" y1="660" x2="400" y2="900"/>
    <line x1="400" y1="660" x2="580" y2="900"/>
    <line x1="400" y1="660" x2="760" y2="900"/>
    <line x1="140" y1="720" x2="660" y2="720"/>
    <line x1="70" y1="800" x2="730" y2="800"/>
  </g>

  <!-- Distant blurred racking, left and right (depth of field) -->
  <g filter="url(#softBlur)" opacity="0.55">
    <rect x="10" y="360" width="16" height="300" fill="url(#rackGrad)"/>
    <rect x="120" y="360" width="16" height="300" fill="url(#rackGrad)"/>
    <rect x="10" y="400" width="126" height="8" fill="url(#rackGrad)"/>
    <rect x="10" y="490" width="126" height="8" fill="url(#rackGrad)"/>
    <rect x="10" y="580" width="126" height="8" fill="url(#rackGrad)"/>

    <rect x="664" y="360" width="16" height="300" fill="url(#rackGrad)"/>
    <rect x="774" y="360" width="16" height="300" fill="url(#rackGrad)"/>
    <rect x="664" y="400" width="126" height="8" fill="url(#rackGrad)"/>
    <rect x="664" y="490" width="126" height="8" fill="url(#rackGrad)"/>
    <rect x="664" y="580" width="126" height="8" fill="url(#rackGrad)"/>
  </g>

  <!-- Mid racking, left, in focus -->
  <g filter="url(#softShadow)">
    <rect x="118" y="230" width="14" height="440" fill="url(#rackGrad)"/>
    <rect x="248" y="230" width="14" height="440" fill="url(#rackGrad)"/>
    <rect x="118" y="284" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="118" y="410" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="118" y="536" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="118" y="655" width="144" height="9" fill="#003f87"/>
    <g>
      <rect x="128" y="238" width="46" height="42" rx="2" fill="url(#boxGradLight)"/>
      <rect x="182" y="232" width="52" height="48" rx="2" fill="url(#boxGradKraft)"/>
      <rect x="128" y="330" width="50" height="76" rx="2" fill="url(#boxGradKraft)"/>
      <rect x="186" y="338" width="44" height="68" rx="2" fill="url(#boxGradLight)"/>
      <rect x="128" y="456" width="48" height="76" rx="2" fill="url(#boxGradLight)"/>
      <rect x="184" y="450" width="52" height="82" rx="2" fill="url(#boxGradKraft)"/>
    </g>
  </g>

  <!-- Mid racking, right, in focus -->
  <g filter="url(#softShadow)">
    <rect x="538" y="230" width="14" height="440" fill="url(#rackGrad)"/>
    <rect x="668" y="230" width="14" height="440" fill="url(#rackGrad)"/>
    <rect x="538" y="284" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="538" y="410" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="538" y="536" width="144" height="9" fill="url(#rackGrad)"/>
    <rect x="538" y="655" width="144" height="9" fill="#003f87"/>
    <g>
      <rect x="548" y="242" width="48" height="38" rx="2" fill="url(#boxGradKraft)"/>
      <rect x="604" y="234" width="50" height="46" rx="2" fill="url(#boxGradLight)"/>
      <rect x="550" y="334" width="46" height="72" rx="2" fill="url(#boxGradLight)"/>
      <rect x="608" y="342" width="48" height="64" rx="2" fill="url(#boxGradKraft)"/>
      <rect x="548" y="458" width="50" height="74" rx="2" fill="url(#boxGradKraft)"/>
      <rect x="606" y="452" width="46" height="80" rx="2" fill="url(#boxGradLight)"/>
    </g>
  </g>

  <!-- Foreground stacked pallet, left -->
  <g filter="url(#softShadow)">
    <rect x="46" y="726" width="16" height="18" fill="#8a6a3c"/>
    <rect x="150" y="726" width="16" height="18" fill="#8a6a3c"/>
    <rect x="40" y="710" width="132" height="16" fill="#a9865a"/>
    <rect x="58" y="606" width="106" height="104" rx="3" fill="url(#boxGradKraft)"/>
    <rect x="70" y="500" width="88" height="106" rx="3" fill="url(#boxGradLight)"/>
    <rect x="74" y="522" width="34" height="34" rx="2" fill="#c9d3e0"/>
    <rect x="118" y="522" width="30" height="34" rx="2" fill="#c9d3e0"/>
  </g>

  <!-- Foreground stacked pallet, right -->
  <g filter="url(#softShadow)">
    <rect x="612" y="742" width="16" height="18" fill="#8a6a3c"/>
    <rect x="716" y="742" width="16" height="18" fill="#8a6a3c"/>
    <rect x="606" y="726" width="132" height="16" fill="#a9865a"/>
    <rect x="622" y="628" width="100" height="98" rx="3" fill="url(#boxGradLight)"/>
    <rect x="636" y="536" width="76" height="92" rx="3" fill="url(#boxGradKraft)"/>
  </g>

  <!-- Rolls of large-format printing paper, foreground center-left -->
  <g filter="url(#softShadow)">
    <ellipse cx="240" cy="760" rx="34" ry="34" fill="#eef1f5" stroke="#c3cbd8" stroke-width="3"/>
    <circle cx="240" cy="760" r="10" fill="#c3cbd8"/>
    <rect x="206" y="760" width="200" height="40" fill="#eef1f5"/>
    <ellipse cx="406" cy="760" rx="34" ry="34" fill="#f7f9fb" stroke="#c3cbd8" stroke-width="3"/>
    <circle cx="406" cy="760" r="10" fill="#c3cbd8"/>
  </g>

  <!-- Forklift, motion-blurred, center -->
  <g transform="translate(330,700)" filter="url(#motionBlur)" opacity="0.85">
    <rect x="0" y="42" width="128" height="44" rx="6" fill="#f2a71b"/>
    <rect x="12" y="6" width="66" height="40" rx="4" fill="#f2a71b"/>
    <rect x="18" y="12" width="38" height="22" rx="2" fill="#dce9f5" opacity="0.7"/>
    <circle cx="24" cy="92" r="16" fill="#22262b"/>
    <circle cx="24" cy="92" r="6" fill="#6b7280"/>
    <circle cx="100" cy="92" r="16" fill="#22262b"/>
    <circle cx="100" cy="92" r="6" fill="#6b7280"/>
    <rect x="114" y="-34" width="7" height="112" fill="#9aa3ad"/>
    <rect x="144" y="-34" width="7" height="112" fill="#9aa3ad"/>
    <rect x="114" y="16" width="37" height="9" fill="#9aa3ad"/>
  </g>
  <!-- faint motion streak lines to reinforce blur -->
  <g stroke="#c7cfda" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <line x1="300" y1="760" x2="250" y2="760"/>
    <line x1="300" y1="778" x2="260" y2="778"/>
  </g>

  <!-- Soft overhead lighting streaks -->
  <g stroke="#ffffff" stroke-width="10" opacity="0.5" filter="url(#softBlur)">
    <line x1="60" y1="40" x2="300" y2="40"/>
    <line x1="360" y1="30" x2="620" y2="30"/>
    <line x1="500" y1="70" x2="760" y2="70"/>
  </g>

  <!-- Subtle navy accent line (brand touch) along the floor edge -->
  <rect x="0" y="656" width="800" height="4" fill="#003f87" opacity="0.6"/>
</svg>
