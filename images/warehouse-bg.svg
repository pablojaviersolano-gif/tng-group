<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00274f"/>
      <stop offset="55%" stop-color="#00336c"/>
      <stop offset="100%" stop-color="#004996"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001c3d"/>
      <stop offset="100%" stop-color="#00152e"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="100%" stop-color="#c3d1e6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- Perspective floor -->
  <polygon points="0,900 800,900 800,640 0,640" fill="url(#floorGrad)" opacity="0.9"/>
  <g stroke="#3c6fae" stroke-width="2" opacity="0.35">
    <line x1="400" y1="640" x2="60" y2="900"/>
    <line x1="400" y1="640" x2="230" y2="900"/>
    <line x1="400" y1="640" x2="400" y2="900"/>
    <line x1="400" y1="640" x2="570" y2="900"/>
    <line x1="400" y1="640" x2="740" y2="900"/>
    <line x1="130" y1="700" x2="670" y2="700"/>
    <line x1="60" y1="780" x2="740" y2="780"/>
  </g>

  <!-- Distant racking, left -->
  <g opacity="0.55">
    <rect x="30" y="330" width="24" height="330" fill="#0b3f7c"/>
    <rect x="140" y="330" width="24" height="330" fill="#0b3f7c"/>
    <rect x="30" y="370" width="134" height="10" fill="#0b3f7c"/>
    <rect x="30" y="470" width="134" height="10" fill="#0b3f7c"/>
    <rect x="30" y="570" width="134" height="10" fill="#0b3f7c"/>
  </g>

  <!-- Distant racking, right -->
  <g opacity="0.55">
    <rect x="636" y="330" width="24" height="330" fill="#0b3f7c"/>
    <rect x="746" y="330" width="24" height="330" fill="#0b3f7c"/>
    <rect x="636" y="370" width="134" height="10" fill="#0b3f7c"/>
    <rect x="636" y="470" width="134" height="10" fill="#0b3f7c"/>
    <rect x="636" y="570" width="134" height="10" fill="#0b3f7c"/>
  </g>

  <!-- Tall center-left racking with boxes -->
  <g>
    <rect x="120" y="200" width="18" height="470" fill="#0e4a90"/>
    <rect x="260" y="200" width="18" height="470" fill="#0e4a90"/>
    <rect x="120" y="260" width="158" height="12" fill="#0e4a90"/>
    <rect x="120" y="400" width="158" height="12" fill="#0e4a90"/>
    <rect x="120" y="540" width="158" height="12" fill="#0e4a90"/>
    <!-- boxes on shelves -->
    <g fill="url(#boxGrad)">
      <rect x="132" y="212" width="46" height="42" rx="2"/>
      <rect x="188" y="206" width="52" height="48" rx="2"/>
      <rect x="132" y="322" width="50" height="70" rx="2"/>
      <rect x="192" y="330" width="44" height="62" rx="2"/>
      <rect x="132" y="462" width="48" height="70" rx="2"/>
      <rect x="190" y="456" width="52" height="76" rx="2"/>
    </g>
  </g>

  <!-- Tall center-right racking with boxes -->
  <g>
    <rect x="522" y="200" width="18" height="470" fill="#0e4a90"/>
    <rect x="662" y="200" width="18" height="470" fill="#0e4a90"/>
    <rect x="522" y="260" width="158" height="12" fill="#0e4a90"/>
    <rect x="522" y="400" width="158" height="12" fill="#0e4a90"/>
    <rect x="522" y="540" width="158" height="12" fill="#0e4a90"/>
    <g fill="url(#boxGrad)">
      <rect x="534" y="216" width="48" height="38" rx="2"/>
      <rect x="592" y="208" width="50" height="46" rx="2"/>
      <rect x="536" y="326" width="46" height="66" rx="2"/>
      <rect x="596" y="334" width="48" height="58" rx="2"/>
      <rect x="534" y="464" width="50" height="68" rx="2"/>
      <rect x="594" y="458" width="46" height="74" rx="2"/>
    </g>
  </g>

  <!-- Stacked pallet of boxes, foreground left -->
  <g fill="url(#boxGrad)">
    <rect x="70" y="700" width="120" height="86" rx="3"/>
    <rect x="90" y="614" width="100" height="86" rx="3"/>
    <rect x="76" y="738" width="46" height="48" rx="2" fill="#aebedb"/>
    <rect x="130" y="738" width="52" height="48" rx="2" fill="#aebedb"/>
  </g>
  <rect x="60" y="786" width="140" height="14" fill="#7a5230"/>

  <!-- Stacked boxes, foreground right -->
  <g fill="url(#boxGrad)">
    <rect x="610" y="726" width="110" height="78" rx="3"/>
    <rect x="628" y="648" width="90" height="78" rx="3"/>
  </g>
  <rect x="600" y="804" width="130" height="13" fill="#7a5230"/>

  <!-- Forklift silhouette, center, slightly blurred feel via opacity -->
  <g transform="translate(300,730)" opacity="0.9">
    <rect x="0" y="40" width="130" height="46" rx="6" fill="#f2a71b"/>
    <rect x="14" y="4" width="70" height="42" rx="4" fill="#f2a71b"/>
    <rect x="20" y="10" width="40" height="24" rx="2" fill="#bfe3ff" opacity="0.6"/>
    <circle cx="26" cy="92" r="17" fill="#161616"/>
    <circle cx="26" cy="92" r="7" fill="#5a5a5a"/>
    <circle cx="104" cy="92" r="17" fill="#161616"/>
    <circle cx="104" cy="92" r="7" fill="#5a5a5a"/>
    <rect x="118" y="-38" width="8" height="120" fill="#8a8f95"/>
    <rect x="150" y="-38" width="8" height="120" fill="#8a8f95"/>
    <rect x="118" y="18" width="40" height="10" fill="#8a8f95"/>
  </g>

  <!-- Soft vignette / light glow to unify the scene -->
  <ellipse cx="400" cy="120" rx="420" ry="180" fill="#3cd7ff" opacity="0.12"/>
  <rect width="800" height="900" fill="url(#bgGrad)" opacity="0.06"/>

  <!-- Overhead cool lighting streaks -->
  <g stroke="#bfe3ff" stroke-width="3" opacity="0.18">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="110" x2="800" y2="110"/>
  </g>
</svg>
